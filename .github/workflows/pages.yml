name: Deploy preview to GitHub Pages

# Builds the static export and publishes it to GitHub Pages so the site has a
# shareable URL: https://<owner>.github.io/<repo>/
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; let a newer push supersede an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        # Deliberately no "enablement: true" — the Actions token can deploy to
        # Pages but is not allowed to create the Pages site, so Pages is
        # switched on once by hand: Settings → Pages → Source: GitHub Actions.

      - name: Build static export
        # base_path is "/<repo>" for a project site, "" for a user/org site.
        run: npm run build
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # The preview shows what's published in Talous CMS; if the CMS can't be
          # reached it falls back to the text that ships in the repo.
          TALOUS_CMS_URL: https://cms.edgepoint.work
          TALOUS_PROJECT_ID: 74f71b1c-e725-4579-bb3d-563f35f56ac6

      - name: Leave out the server-only parts
        # The editor and the CMS's endpoints only work on the server copy on talos.
        run: rm -rf out/studio.html out/studio.txt out/api out/_none.html out/_none.txt

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
