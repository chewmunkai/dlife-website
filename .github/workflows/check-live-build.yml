name: Check the live build

# Builds the site exactly as the live dlife.com.my build does (plain files, with
# the content published in Talous CMS, failing if the CMS can't be read), so a
# change that would break the live site shows up here on the push.
#
# It doesn't upload: the client's cPanel host refuses FTP from outside Malaysia,
# GitHub's runners included. The talos publisher (talous-cms/publisher) builds
# and uploads instead, when main moves and after every publish in the CMS.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      STATIC_EXPORT: "1"
      TALOUS_CMS_URL: https://cms.edgepoint.work
      TALOUS_PROJECT_ID: 74f71b1c-e725-4579-bb3d-563f35f56ac6
      TALOUS_REQUIRE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check the CMS is answering
        run: curl -fsS --retry 3 --retry-delay 10 -o /dev/null "$TALOUS_CMS_URL/api/public/pages?project=$TALOUS_PROJECT_ID&slug=home"

      - name: Build static export
        run: npm run build
